<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipDrive | Digital Flipbook Reader</title>
  
  <!-- CDNs for Turn.js & PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #111218;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 86vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flipbook {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .page {
      background: #ffffff;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #status-layer {
      position: fixed;
      inset: 0;
      background: #111218;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 24px;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status-msg {
      font-size: 15px;
      color: #94a3b8;
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
    }

    #dock {
      position: fixed;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(24, 25, 36, 0.9);
      padding: 8px 18px;
      border-radius: 40px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .dock-btn {
      background: #232534;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #f1f5f9;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
    }

    .dock-btn:hover:not(:disabled) {
      background: #3b82f6;
      color: #fff;
    }

    .dock-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    #page-indicator {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: #cbd5e1;
      padding: 0 10px;
    }

    @media (max-width: 640px) {
      #dock {
        bottom: 14px;
        padding: 6px 12px;
        gap: 6px;
      }
      .dock-btn {
        padding: 6px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div id="status-layer">
    <div class="spinner" id="spinner"></div>
    <div id="status-msg">Initializing flipbook engine...</div>
  </div>

  <div id="stage">
    <div id="flipbook"></div>
  </div>

  <div id="dock">
    <button class="dock-btn" id="btn-first" title="First Page">&laquo;</button>
    <button class="dock-btn" id="btn-prev" title="Previous Page">&lsaquo; Prev</button>
    <div id="page-indicator"><span id="lbl-curr">1</span> / <span id="lbl-total">-</span></div>
    <button class="dock-btn" id="btn-next" title="Next Page">Next &rsaquo;</button>
    <button class="dock-btn" id="btn-last" title="Last Page">&raquo;</button>
    <button class="dock-btn" id="btn-fullscreen" title="Toggle Fullscreen">&#x26F6;</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // OPTIONAL: Paste your deployed Google Apps Script URL here so you don't have to specify it in URL query strings!
    const DEFAULT_GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzadHLrOFoiZfPf0GiWK8zIIt5yEiN7kPIgoMBM1Yl267ApwX0k74RlH2DMvzv7n9Lg/exec"; 

    const params = new URLSearchParams(window.location.search);
    const fileId = params.get('id');
    const directPdf = params.get('pdf');
    const gasEndpoint = params.get('gas') || DEFAULT_GAS_ENDPOINT;

    const statusLayer = document.getElementById('status-layer');
    const statusMsg = document.getElementById('status-msg');
    const spinner = document.getElementById('spinner');

    function showError(html) {
      spinner.style.display = 'none';
      statusMsg.innerHTML = html;
    }

    function getViewportSize() {
      const isMobile = window.innerWidth <= 768;
      const w = isMobile ? window.innerWidth * 0.94 : Math.min(window.innerWidth * 0.9, 1100);
      const h = isMobile ? window.innerHeight * 0.78 : Math.min(window.innerHeight * 0.82, 740);
      return { width: Math.round(w), height: Math.round(h), isMobile };
    }

    function base64ToUint8Array(base64) {
      const raw = atob(base64);
      const uint8 = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) {
        uint8[i] = raw.charCodeAt(i);
      }
      return uint8;
    }

    async function loadPdfDocument() {
      // 1. Direct PDF URL
      if (directPdf) {
        statusMsg.textContent = 'Loading direct PDF stream...';
        return await pdfjsLib.getDocument({ url: directPdf }).promise;
      }

      if (!fileId) {
        throw new Error("No publication ID provided. Add <code>?id=YOUR_FILE_ID</code> to the URL.");
      }

      // 2. High-speed Google Apps Script Bridge
      if (gasEndpoint) {
        statusMsg.textContent = 'Fetching document via Google Apps Script bridge...';
        const targetUrl = `${gasEndpoint}?id=${fileId}`;
        const resp = await fetch(targetUrl);
        const data = await resp.json();

        if (data.status === 'error') {
          throw new Error(data.message || "Apps Script failed to retrieve file.");
        }

        if (data.name) {
          document.title = `${data.name} | FlipDrive`;
        }

        statusMsg.textContent = 'Decompressing document bytes...';
        const pdfBytes = base64ToUint8Array(data.base64);
        return await pdfjsLib.getDocument({ data: pdfBytes }).promise;
      }

      // 3. Fallback: Proxy pipeline if GAS endpoint is not configured yet
      const rawUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
      const proxies = [
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rawUrl)}`,
        `https://corsproxy.io/?url=${encodeURIComponent(rawUrl)}`
      ];

      for (let i = 0; i < proxies.length; i++) {
        try {
          statusMsg.textContent = `Attempting stream fetch (proxy ${i + 1}/${proxies.length})...`;
          const loadingTask = pdfjsLib.getDocument({ url: proxies[i], withCredentials: false });
          const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 7000));
          return await Promise.race([loadingTask.promise, timeoutPromise]);
        } catch (e) {
          console.warn("Proxy attempt failed:", e);
        }
      }

      throw new Error("Drive binary stream was blocked. Please configure the Apps Script Bridge.");
    }

    async function init() {
      try {
        const pdf = await loadPdfDocument();
        const totalPages = pdf.numPages;
        document.getElementById('lbl-total').textContent = totalPages;

        statusMsg.textContent = 'Generating page textures...';
        const { width, height, isMobile } = getViewportSize();

        for (let i = 1; i <= totalPages; i++) {
          const pageDiv = $('<div />', { class: 'page', id: `page-${i}` });
          const canvas = $('<canvas />')[0];
          pageDiv.append(canvas);
          $('#flipbook').append(pageDiv);

          renderCanvas(pdf, i, canvas);
        }

        $('#flipbook').turn({
          width: width,
          height: height,
          autoCenter: true,
          display: isMobile ? 'single' : 'double',
          acceleration: true,
          elevation: 50,
          gradients: true,
          when: {
            turned: function(e, page) {
              document.getElementById('lbl-curr').textContent = page;
              updateControls(page, totalPages);
            }
          }
        });

        statusLayer.style.opacity = '0';
        setTimeout(() => statusLayer.style.display = 'none', 300);

        bindEvents(totalPages);

      } catch (err) {
        showError(
          `<strong>Publication Load Error</strong><br><br>${err.message}<br><br>` +
          `<span style="font-size:13px; color:#cbd5e1;">Tip: Deploy the Apps Script bridge script and pass <code>&gas=YOUR_URL</code> or set <code>DEFAULT_GAS_ENDPOINT</code> in index.html.</span>`
        );
      }
    }

    async function renderCanvas(pdf, pageNum, canvas) {
      try {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.8 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      } catch (e) {
        console.warn(`Render error on page ${pageNum}:`, e);
      }
    }

    function updateControls(page, total) {
      document.getElementById('btn-prev').disabled = (page <= 1);
      document.getElementById('btn-first').disabled = (page <= 1);
      document.getElementById('btn-next').disabled = (page >= total);
      document.getElementById('btn-last').disabled = (page >= total);
    }

    function bindEvents(totalPages) {
      $('#btn-prev').on('click', () => $('#flipbook').turn('previous'));
      $('#btn-next').on('click', () => $('#flipbook').turn('next'));
      $('#btn-first').on('click', () => $('#flipbook').turn('page', 1));
      $('#btn-last').on('click', () => $('#flipbook').turn('page', totalPages));

      $(document).on('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown') $('#flipbook').turn('next');
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') $('#flipbook').turn('previous');
      });

      $('#btn-fullscreen').on('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      window.addEventListener('resize', () => {
        const dims = getViewportSize();
        $('#flipbook').turn('display', dims.isMobile ? 'single' : 'double');
        $('#flipbook').turn('size', dims.width, dims.height);
      });
    }

    init();
  </script>
</body>
</html>
